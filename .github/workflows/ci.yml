name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      # zero runtime dependencies — this is the guard that keeps it that way
      - run: npm audit --omit=dev --audit-level=high

  unit-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:unit
      - run: npm run validate   # strict content QA incl. provenance + freshness + blueprints + jurisdiction contract
      - run: npm run hygiene    # cross-project contamination guard

  e2e:
    runs-on: ubuntu-latest
    needs: [unit-and-content, lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chrome, mobile-chrome, mobile-safari]   # WebKit included — Safari parity matters on iOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --project=${{ matrix.project }}
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: unit-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Run Lighthouse against the served app
        run: |
          node serve.js &
          sleep 2
          npx --yes lighthouse@latest http://localhost:8321 \
            --output=json --output-path=lighthouse.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless=new" --quiet
          node -e "
            const r = require('./lighthouse.json');
            const s = Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,v.score]));
            console.log(s);
            const min = { performance: .7, accessibility: .9, 'best-practices': .9, seo: .8 };
            for (const [k,v] of Object.entries(min)) {
              if ((s[k] ?? 0) < v) { console.error('FAIL', k, s[k]); process.exit(1); }
            }
            console.log('Lighthouse thresholds met');
          "
